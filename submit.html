<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Miku - Guess this Miku Country</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Load our scripts -->
    <script src="./cloud-storage.js"></script>
    <script src="./auth-check.js"></script>
</head>
<body>
    <header>
        <h1>Guess this Miku Country</h1>
        <nav>
            <!-- Navigation will be populated by auth-check.js -->
        </nav>
    </header>

    <main class="submit-container">
        <h2>Submit New Image</h2>
        <div id="login-warning" class="login-warning" style="display: block;">
            Please <a href="./auth.html">login</a> to submit your Miku!
        </div>
        
        <form id="submit-form" class="submission-form hidden">            
            <div class="form-group">
                <label for="file-input">Image Upload:</label>
                <input type="file" 
                       id="file-input" 
                       accept="image/*"
                       style="display: block; margin-bottom: 1rem;">
                <div id="drop-zone" class="drop-zone">
                    <div class="drop-zone-text">
                        Or drop your image here
                    </div>
                </div>
                <div id="preview-container">
                    <span id="file-name" class="file-name"></span>
                    <img id="image-preview" class="hidden" alt="Preview">
                </div>
            </div>

            <div class="form-group">
                <label for="miku-country">Miku's Country:</label>
                <div class="country-input-wrapper">
                    <input type="text" 
                           id="miku-country" 
                           name="miku-country" 
                           placeholder="Type country name..."
                           autocomplete="off" 
                           spellcheck="false"
                           required>
                    <div id="country-suggestions" class="country-suggestions"></div>
                </div>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="is-own-work" name="is-own-work">
                    This is my own artwork
                </label>
            </div>

            <div class="form-group" id="artist-credit-field">
                <label for="artist-credit">Artist Credit (if not your own work):</label>
                <input type="text" id="artist-credit" name="artist-credit" placeholder="Artist name/handle">
            </div>

            <div class="form-group">
                <button type="submit" class="submit-button">Submit</button>
            </div>
        </form>
    </main>

    <footer>
        <p>Created with ♥ for Miku fans</p>
    </footer>
</body>
</html>
