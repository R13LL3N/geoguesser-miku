[build]
  command = "# no build command needed for static site"
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/api/db-test"
  to = "/.netlify/functions/test-db"
  status = 200
  force = true

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/auth-blobs"
  status = 200
  force = true

[[redirects]]
  from = "/api/signup"
  to = "/.netlify/functions/auth-blobs"
  status = 200
  force = true

[[redirects]]
  from = "/api/simple-login"
  to = "/.netlify/functions/auth-simple"
  status = 200
  force = true

[[redirects]]
  from = "/api/simple-signup"
  to = "/.netlify/functions/auth-simple"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200