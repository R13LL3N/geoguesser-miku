<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoguesser Miku</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Load dependencies first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Initialize supabase -->
    <script>
        window.supabaseUrl = 'https://fwrgisesmzdwclaclptu.supabase.co';
        window.supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3cmdpc2VzbXpkd2NsYWNscHR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU3MjM2OTcsImV4cCI6MjA2MTI5OTY5N30.pJ_E7BXerv9nuXDd7MnHt4ncQ0CG2qHlD0baugQoiHo';
        window.supabaseClient = supabase.createClient(window.supabaseUrl, window.supabaseKey);
    </script>
    <!-- Load our scripts after Supabase is initialized -->
    <script src="./cloud-storage.js" defer></script>
    <script src="./auth-check.js" defer></script>
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <h1>Geoguesser Miku</h1>
        <nav>
            <a href="./auth.html">Login/Signup</a>
            <a href="./submit.html">Submit Miku</a>
        </nav>
    </header>

    <main class="game-container">
        <div class="game-layout">
            <div class="game-section">
                <div class="miku-display">
                    <img id="current-miku" src="placeholder.jpg" alt="Guess this Miku's ethnicity">
                </div>
                <div class="guess-section">
                    <h2>Guess the Miku's country!</h2>
                    <div class="guess-input-container">
                        <div class="guess-input">
                            <input type="text" 
                                   id="guess-input" 
                                   autocomplete="off" 
                                   spellcheck="false"
                                   list="none"
                                   placeholder="Type country name...">
                            <button onclick="submitGuess()">Submit Guess</button>
                        </div>
                        <div id="country-suggestions" class="country-suggestions"></div>
                    </div>
                    <div id="result"></div>
                    <div id="submission-details" class="submission-details hidden">
                        <h3>Image Details</h3>
                        <p>Submitted by: <span id="submitter-name"></span></p>
                        <p>Artist: <span id="artist-credit"></span></p>
                        <p>Country: <span id="correct-country"></span></p>
                    </div>
                    <button id="next-miku" onclick="nextMiku()">Next Miku</button>
                    <div id="score"></div>
                </div>
            </div>
            <div class="leaderboard-section">
                <div class="leaderboard">
                    <h2>Top Scores</h2>
                    <div id="leaderboard-list"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>Created with ♥ for Miku fans</p>
    </footer>
</body>
</html>
