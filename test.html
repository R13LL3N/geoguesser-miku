<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - Geoguesser Miku</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            max-width: 800px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        h1 {
            color: #39c9bb;
        }
        button {
            background-color: #39c9bb;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ba89b;
        }
        pre {
            background-color: #222;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            color: #fff;
        }
        .success {
            color: #4caf50;
        }
        .error {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Geoguesser Miku - Test Page</h1>
        <p>This page tests if the auth functions are working correctly.</p>
        
        <div>
            <button id="testSignup">Test Signup</button>
            <button id="testLogin">Test Login</button>
        </div>
        
        <h2>Results:</h2>
        <pre id="results">Click a button to see results...</pre>
    </div>

    <script>
        document.getElementById('testSignup').addEventListener('click', async () => {
            const resultsElement = document.getElementById('results');
            resultsElement.textContent = 'Testing signup...';
            
            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: `test${Date.now()}@example.com`,
                        password: 'password123',
                        username: `User${Date.now().toString().slice(-4)}`
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultsElement.innerHTML = `<span class="success">Signup Success!</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultsElement.innerHTML = `<span class="error">Signup Failed!</span>\n\nStatus: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultsElement.innerHTML = `<span class="error">Error:</span>\n\n${error.message}`;
            }
        });
        
        document.getElementById('testLogin').addEventListener('click', async () => {
            const resultsElement = document.getElementById('results');
            resultsElement.textContent = 'Testing login...';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'demo@example.com',
                        password: 'password123'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultsElement.innerHTML = `<span class="success">Login Success!</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultsElement.innerHTML = `<span class="error">Login Failed!</span>\n\nStatus: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultsElement.innerHTML = `<span class="error">Error:</span>\n\n${error.message}`;
            }
        });
    </script>
</body>
</html>
