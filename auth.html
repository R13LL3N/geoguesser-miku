<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup - Geoguesser Miku</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Load our scripts -->
    <script src="./auth-check.js" defer></script>
    <script src="./auth.js" defer></script>
</head>
<body>
    <header>
        <h1>Geoguesser Miku</h1>
        <nav>
            <a href="./index.html">Play Game</a>
            <a href="./submit.html">Submit Miku</a>
        </nav>
    </header>

    <main class="auth-container">
        <div class="form-container" id="login-form">
            <h2>Login</h2>
            <form>
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p class="form-toggle">Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
        </div>

        <div class="form-container" id="signup-form" style="display: none;">
            <h2>Sign Up</h2>
            <form>
                <input type="text" id="signup-username" placeholder="Username" required>
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password" required minlength="6">
                <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required minlength="6">
                <button type="submit">Sign Up</button>
            </form>
            <p class="form-toggle">Already have an account? <a href="#" id="show-login">Login</a></p>
        </div>
    </main>

    <footer>
        <p>Created with ♥ for Miku fans</p>
    </footer>
</body>
</html>
